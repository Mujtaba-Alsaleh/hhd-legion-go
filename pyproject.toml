[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-battery-hhd"
version = "1.0.0"
description = "Legion Go controller battery tab for hhd-ui"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
# hhd provides everything; the plugin is stdlib only.
dependencies = []

# hhd discovers plugins through this entry point group. The same line is what
# vendor-hhd.sh writes into hhd's own pyproject.toml when the plugin is folded
# into the hhd package (the module then lives at hhd.plugins.legion_battery).
[project.entry-points."hhd.plugins"]
legion_battery = "legion_battery:autodetect"

[tool.setuptools]
py-modules = ["legion_battery"]
